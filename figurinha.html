<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Figurinha Agenda - Resultt+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }

        .sticker-card {
            border-radius: 50px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.12);
            border: 12px solid white;
            width: 18rem; /* 72 units */
            height: 18rem; /* 72 units */
        }

        .custom-orange { color: #e88f23; }
        .bg-custom-orange { background-color: #e88f23; }
        .bg-custom-orange-light { background-color: rgba(232, 143, 35, 0.09); }
        .custom-green { color: #82ccaa; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 text-slate-900">

    <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-100">
        <h1 class="text-2xl font-extrabold text-slate-800 mb-2 text-center">Gerador de Figurinha</h1>
        <p class="text-center text-slate-500 text-sm mb-8 font-medium">Personalize seu aviso de horário marcado</p>
        
        <!-- Formulário de Edição -->
        <div class="space-y-5 mb-10">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 ml-1 text-left">Nome do Cliente</label>
                <input 
                    type="text" 
                    id="clientInput"
                    value="Cliente Especial"
                    class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-400 focus:border-transparent outline-none transition-all"
                    placeholder="Ex: João Silva"
                >
            </div>
            <div class="grid grid-cols-2 gap-4 text-left">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 ml-1">Data</label>
                    <input 
                        type="text" 
                        id="dateInput"
                        value="10/10/2024"
                        class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-400 focus:border-transparent outline-none transition-all"
                    >
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 ml-1">Horário</label>
                    <input 
                        type="text" 
                        id="timeInput"
                        value="14:30"
                        class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-400 focus:border-transparent outline-none transition-all"
                    >
                </div>
            </div>
        </div>

        <!-- Visualização da Figurinha (Estilo Sticker) -->
        <div class="flex justify-center mb-8">
            <div id="sticker" class="sticker-card bg-white flex flex-col items-center justify-between p-7 relative overflow-hidden">
                
                <!-- Logo Oficial -->
                <div class="w-full flex justify-center pt-2">
                    <img 
                        src="https://guesserlucas.github.io/resultt/01.png" 
                        alt="Result+ Logo" 
                        class="max-h-16 w-auto object-contain"
                    >
                </div>

                <div class="flex flex-col items-center w-full">
                    <div 
                        class="px-4 py-1.5 rounded-full text-[10px] font-black mb-4 uppercase tracking-[0.2em] shadow-sm bg-custom-orange-light custom-orange"
                    >
                        Horário Marcado
                    </div>
                    
                    <div class="flex flex-col items-center gap-1.5">
                        <div class="flex items-center gap-2 text-slate-500">
                            <i data-lucide="calendar" class="w-3.5 h-3.5 opacity-60"></i>
                            <span id="displayDate" class="font-semibold text-sm">10/10/2024</span>
                        </div>
                        <div class="flex items-center gap-2 text-slate-800">
                            <i data-lucide="clock" class="w-5 h-5 custom-orange"></i>
                            <span id="displayTime" class="font-black text-4xl tracking-tighter">14:30</span>
                        </div>
                    </div>
                </div>

                <div class="w-full flex flex-col items-center border-t border-slate-50 pt-4">
                    <p class="text-[9px] text-slate-400 uppercase font-bold tracking-widest mb-0.5">Confirmado para:</p>
                    <p id="displayClient" class="text-sm font-bold text-slate-700 truncate max-w-full">Cliente Especial</p>
                </div>

                <!-- Ícone de confirmação flutuante -->
                <div class="absolute top-4 right-6">
                    <i data-lucide="check-circle-2" class="w-5 h-5 custom-green opacity-40"></i>
                </div>
            </div>
        </div>

        <div class="bg-orange-50 p-4 rounded-xl border border-orange-100 flex items-start gap-3 text-left">
            <div class="bg-orange-500 text-white rounded-full p-1 mt-0.5">
                <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>
            </div>
            <p class="text-orange-800 text-xs leading-relaxed">
                <b>Pronto!</b> Agora basta tirar um <b>print (captura de tela)</b> da figurinha branca acima e enviá-la para o seu cliente no WhatsApp.
            </p>
        </div>
    </div>

    <script>
        // Inicializar ícones do Lucide
        lucide.createIcons();

        // Elementos de entrada
        const clientInput = document.getElementById('clientInput');
        const dateInput = document.getElementById('dateInput');
        const timeInput = document.getElementById('timeInput');

        // Elementos de exibição
        const displayClient = document.getElementById('displayClient');
        const displayDate = document.getElementById('displayDate');
        const displayTime = document.getElementById('displayTime');

        // Função para atualizar a figurinha
        function updateSticker() {
            displayClient.textContent = clientInput.value || "Cliente";
            displayDate.textContent = dateInput.value || "--/--/----";
            displayTime.textContent = timeInput.value || "00:00";
        }

        // Adicionar ouvintes de eventos
        clientInput.addEventListener('input', updateSticker);
        dateInput.addEventListener('input', updateSticker);
        timeInput.addEventListener('input', updateSticker);
    </script>
</body>
</html>
